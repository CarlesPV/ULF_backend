name: Deploy Backend

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

env:
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
  FIREBASE_DATABASE_URL: https://unilost-and-found-b6bb3-default-rtdb.firebaseio.com

jobs:
  backend-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: cd functions && npm install
      - name: Run unit tests
        run: cd functions && npm run test:unit

  backend-integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: cd functions && npm install
      - name: Run integration tests
        run: cd functions && npm run test:integration

  deploy-backend:
    runs-on: ubuntu-latest
    needs:
      - backend-unit-tests
      - backend-integration-tests
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6.0.2
      
      # Configurar Node 20 (LTS Estable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # Instalar y compilar dentro de la carpeta functions
      - name: Install dependencies and build functions
        run: |
          cd functions
          npm install
          npm run build
          
      # Desplegar BD, Functions y Storage
      - name: Deploy Firebase Database, Functions & Storage
        uses: w9jds/firebase-action@v15.11.0
        with:
          args: deploy --project unilost-and-found-b6bb3 --only database,functions,storage --force
        env:
          GCP_SA_KEY: ${{ env.FIREBASE_SERVICE_ACCOUNT }}

  seed-database:
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v6.0.2
      
      # Configurar Node 20 (LTS Estable)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        working-directory: database/seed
        
      - name: Run seed
        run: npm run seed
        working-directory: database/seed
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DATABASE_URL: ${{ env.FIREBASE_DATABASE_URL }}
